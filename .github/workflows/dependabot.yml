name: dependabot

# Dependabot の PR の件名を `<種別> <内容>` の日本語に書き換え、本文の先頭に日本語の要約を足す。
# Dependabot は件名・本文の言語を選べないため。
on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  pull-requests: write

jobs:
  localize:
    name: Localize PR
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
      - name: Rewrite title and body
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          gh pr view "$PR" --json body -q .body > body.md
          gh api "repos/$GH_REPO/pulls/$PR/commits" -q '.[0].commit.message' > commit.txt
          python3 .github/scripts/localize_dependabot_pr.py "$BRANCH" body.md commit.txt > result.json
          gh pr edit "$PR" \
            --title "$(jq -r .title result.json)" \
            --body "$(jq -r .body result.json)"
