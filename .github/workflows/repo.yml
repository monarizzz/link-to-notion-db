name: repo

on:
  pull_request:
  # main で保存したキャッシュだけが各 PR から読めるため、main でも実行してキャッシュを作る
  push:
    branches: [main]

# 同一 PR に連続で push した場合、古い run を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 各ジョブが .github/actions/setup で依存を自分で用意し、ジョブ間に依存関係は作らない。
# install 専用ジョブを前段に置くと、そこが落ちたときに後続が全てスキップされ
# 「どこで落ちたか分からない」状態になるため。
jobs:
  format:
    name: Format check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      - run: pnpm lint
