name: server

on: [pull_request]

# 同一 PR に連続で push した場合、古い run を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 各ジョブが node_modules を直接キャッシュし、ヒット時は pnpm install を丸ごとスキップする。
# pnpm は各ワークスペースの依存を apps/*/node_modules にシンボリックリンクで置くため、両方をキャッシュする。
# ジョブ間に依存関係は作らない。install 専用ジョブを前段に置くと、そこが落ちたときに
# 後続が全てスキップされ「どこで落ちたか分からない」状態になるため。
jobs:
  typecheck:
    name: Type check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ runner.os }}-node24-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm typecheck:server

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - name: Restore node_modules
        id: node-modules
        uses: actions/cache@v4
        with:
          path: |
            node_modules
            apps/*/node_modules
          key: ${{ runner.os }}-node24-node-modules-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.node-modules.outputs.cache-hit != 'true'
        run: pnpm install --frozen-lockfile
      - run: pnpm test:server
