name: storybook

on:
  pull_request:
    paths: &paths
      - "apps/web/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/storybook.yml"
      - ".github/actions/setup/**"
  # main で保存したキャッシュだけが各 PR から読めるため、main でも実行してキャッシュを作る
  push:
    branches: [main]
    paths: *paths

# 同一 PR に連続で push した場合、古い run を打ち切る
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# 各ジョブが .github/actions/setup で依存を自分で用意し、ジョブ間に依存関係は作らない。
# install 専用ジョブを前段に置くと、そこが落ちたときに後続が全てスキップされ
# 「どこで落ちたか分からない」状態になるため。
jobs:
  # Playwright の Chromium を落とす必要があり実行時間が伸びるため、web の型チェックとは
  # 別ワークフローに分離している。
  storybook-test:
    name: Storybook test
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7
      - uses: ./.github/actions/setup
      # node_modules キャッシュには playwright パッケージしか含まれず、
      # ブラウザ本体 (~/.cache/ms-playwright) は別に復元する必要がある。
      - name: Restore Playwright browsers
        id: playwright
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
      - if: steps.playwright.outputs.cache-hit != 'true'
        run: pnpm --filter web exec playwright install --with-deps chromium
      # キャッシュヒット時はブラウザ本体だけ復元され、OS 側の依存ライブラリが
      # 入らないため、そこだけ別途入れる。
      - if: steps.playwright.outputs.cache-hit == 'true'
        run: pnpm --filter web exec playwright install-deps chromium
      - run: pnpm test:storybook
