version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ["*"]

  # pnpm のワークスペースは、ルートと各アプリの package.json をそれぞれ対象にする
  - package-ecosystem: npm
    directories:
      - /
      - /apps/*
    schedule:
      interval: weekly
    groups:
      # メジャー更新は破壊的変更を含むため、まとめずに 1 つずつ PR にする
      npm:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # typescript-eslint が TypeScript 7 に未対応で、Lint が起動しなくなるため
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
